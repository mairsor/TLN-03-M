---
# =============================================================
#  bgp.yml  –  Configuración MP-BGP AS 100
#  Red MPLS L3VPN IPv4/IPv6
#
#  Loopbacks de referencia
#    PE1  →  172.16.1.1      PE2  →  172.16.1.2
#    P2   →  172.16.1.3      P1   →  172.16.1.4
#    RR1  →  172.16.1.5      RR2  →  172.16.1.6
#
#  Ejecución:
#    ansible-playbook -i inventory.ini bgp.yml
# =============================================================


# -------------------------------------------------------------
# PLAY 1 – Routers P (P1 y P2)
#   Rol: clientes RR de tránsito puro.
#   Solo necesitan iBGP hacia RR1/RR2 en IPv4 unicast para
#   que los loopbacks sean alcanzables y LDP funcione.
#   NO participan en VPNv4 ni VPNv6.
# -------------------------------------------------------------
- name: "BGP | P_routers – IPv4 unicast (tránsito)"
  hosts: P_routers
  gather_facts: false

  tasks:

    - name: "P | Proceso BGP, router-id y vecinos hacia RRs"
      cisco.ios.ios_config:
        lines:
          - bgp router-id interface lo0
          - no bgp default ipv4-unicast
          - neighbor 172.16.1.5 remote-as 100
          - neighbor 172.16.1.5 update-source lo0
          - neighbor 172.16.1.6 remote-as 100
          - neighbor 172.16.1.6 update-source lo0
        parents: router bgp 100

    - name: "P | Address-family IPv4 unicast – activar vecinos RR"
      cisco.ios.ios_config:
        lines:
          - neighbor 172.16.1.5 activate
          - neighbor 172.16.1.6 activate
        parents:
          - router bgp 100
          - address-family ipv4 unicast


# -------------------------------------------------------------
# PLAY 2 – Routers PE (PE1 y PE2)
#   Rol: clientes RR con capacidad VPN (PEs de borde).
#   Necesitan iBGP en tres address-families:
#     · IPv4 unicast  – alcanzabilidad de loopbacks
#     · VPNv4         – rutas IPv4 de clientes con RT/RD
#     · VPNv6         – rutas IPv6 de clientes con RT/RD
#   send-community es obligatorio para transportar los
#   Extended Communities (Route Target) de las VPNs.
# -------------------------------------------------------------
- name: "BGP | PE_routers – IPv4 unicast + VPNv4 + VPNv6"
  hosts: PE_routers
  gather_facts: false

  tasks:

    - name: "PE | Proceso BGP, router-id y vecinos hacia RRs"
      cisco.ios.ios_config:
        lines:
          - bgp router-id interface lo0
          - no bgp default ipv4-unicast
          - neighbor 172.16.1.5 remote-as 100
          - neighbor 172.16.1.5 update-source lo0
          - neighbor 172.16.1.6 remote-as 100
          - neighbor 172.16.1.6 update-source lo0
        parents: router bgp 100

    - name: "PE | Address-family IPv4 unicast – activar vecinos RR"
      cisco.ios.ios_config:
        lines:
          - neighbor 172.16.1.5 activate
          - neighbor 172.16.1.6 activate
        parents:
          - router bgp 100
          - address-family ipv4 unicast

    - name: "PE | Address-family VPNv4 – activar RRs con send-community both"
      # 'send-community both' envía standard + extended communities.
      # Las extended communities transportan el Route Target (RT)
      # que permite a los PEs importar/exportar rutas de VRF.
      cisco.ios.ios_config:
        lines:
          - neighbor 172.16.1.5 activate
          - neighbor 172.16.1.5 send-community both
          - neighbor 172.16.1.6 activate
          - neighbor 172.16.1.6 send-community both
        parents:
          - router bgp 100
          - address-family vpnv4

    - name: "PE | Address-family VPNv6 – activar RRs con send-community extended"
      # Para VPNv6 basta con 'extended' ya que solo se necesitan
      # las extended communities para transportar el RT IPv6.
      cisco.ios.ios_config:
        lines:
          - neighbor 172.16.1.5 activate
          - neighbor 172.16.1.5 send-community extended
          - neighbor 172.16.1.6 activate
          - neighbor 172.16.1.6 send-community extended
        parents:
          - router bgp 100
          - address-family vpnv6


# -------------------------------------------------------------
# PLAY 3 – Route Reflectors (RR1 y RR2)
#   Rol: reflectores centrales. Peer iBGP entre sí (sin RRC).
#   Clientes por address-family:
#     · IPv4 unicast  →  PE1, PE2, P1, P2  (todos)
#     · VPNv4         →  PE1, PE2          (solo borde VPN)
#     · VPNv6         →  PE1, PE2          (solo borde VPN)
#   P1 y P2 NO son clientes RR en VPNv4/VPNv6 porque no
#   manejan tablas VPN (son tránsito puro).
# -------------------------------------------------------------
- name: "BGP | RR_routers – Route Reflectors completos"
  hosts: RR_routers
  gather_facts: false

  tasks:

    - name: "RR | Proceso BGP, router-id y declaración de todos los vecinos"
      cisco.ios.ios_config:
        lines:
          - bgp router-id interface lo0
          - no bgp default ipv4-unicast
          # ---------- Peer entre RRs (sin route-reflector-client) ----------
          - neighbor 172.16.1.5 remote-as 100
          - neighbor 172.16.1.5 update-source lo0
          - neighbor 172.16.1.6 remote-as 100
          - neighbor 172.16.1.6 update-source lo0
          # ---------- Clientes PE ----------
          - neighbor 172.16.1.1 remote-as 100
          - neighbor 172.16.1.1 update-source lo0
          - neighbor 172.16.1.2 remote-as 100
          - neighbor 172.16.1.2 update-source lo0
          # ---------- Clientes P ----------
          - neighbor 172.16.1.3 remote-as 100
          - neighbor 172.16.1.3 update-source lo0
          - neighbor 172.16.1.4 remote-as 100
          - neighbor 172.16.1.4 update-source lo0
        parents: router bgp 100

    - name: "RR | IPv4 unicast – activar todos y marcar PE+P como RRC"
      cisco.ios.ios_config:
        lines:
          # Peer RR (NO lleva route-reflector-client)
          - neighbor 172.16.1.5 activate
          - neighbor 172.16.1.6 activate
          # Clientes PE
          - neighbor 172.16.1.1 activate
          - neighbor 172.16.1.1 route-reflector-client
          - neighbor 172.16.1.2 activate
          - neighbor 172.16.1.2 route-reflector-client
          # Clientes P
          - neighbor 172.16.1.3 activate
          - neighbor 172.16.1.3 route-reflector-client
          - neighbor 172.16.1.4 activate
          - neighbor 172.16.1.4 route-reflector-client
        parents:
          - router bgp 100
          - address-family ipv4 unicast

    - name: "RR | VPNv4 – peer RR + clientes PE únicamente"
      cisco.ios.ios_config:
        lines:
          # Peer RR
          - neighbor 172.16.1.5 activate
          - neighbor 172.16.1.5 send-community both
          - neighbor 172.16.1.6 activate
          - neighbor 172.16.1.6 send-community both
          # Clientes PE
          - neighbor 172.16.1.1 activate
          - neighbor 172.16.1.1 send-community both
          - neighbor 172.16.1.1 route-reflector-client
          - neighbor 172.16.1.2 activate
          - neighbor 172.16.1.2 send-community both
          - neighbor 172.16.1.2 route-reflector-client
        parents:
          - router bgp 100
          - address-family vpnv4

    - name: "RR | VPNv6 – peer RR + clientes PE únicamente"
      cisco.ios.ios_config:
        lines:
          # Peer RR
          - neighbor 172.16.1.5 activate
          - neighbor 172.16.1.5 send-community extended
          - neighbor 172.16.1.6 activate
          - neighbor 172.16.1.6 send-community extended
          # Clientes PE
          - neighbor 172.16.1.1 activate
          - neighbor 172.16.1.1 send-community extended
          - neighbor 172.16.1.1 route-reflector-client
          - neighbor 172.16.1.2 activate
          - neighbor 172.16.1.2 send-community extended
          - neighbor 172.16.1.2 route-reflector-client
        parents:
          - router bgp 100
          - address-family vpnv6